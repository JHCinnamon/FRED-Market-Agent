name: Local Agent Evals

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Run prompts on the local model
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Ensure LM Studio is running
        shell: pwsh
        run: |
          $lmStudioProcess = Get-Process -Name "LM Studio" -ErrorAction SilentlyContinue
          if ($lmStudioProcess) {
            Write-Host "LM Studio is already running."
            exit 0
          }

          $lmStudioExecutable = Join-Path $env:LOCALAPPDATA "Programs\LM Studio\LM Studio.exe"
          if (-not (Test-Path -LiteralPath $lmStudioExecutable -PathType Leaf)) {
            throw "LM Studio is not running and could not be found at: $lmStudioExecutable"
          }

          Start-Process -FilePath $lmStudioExecutable
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            $lmStudioProcess = Get-Process -Name "LM Studio" -ErrorAction SilentlyContinue
          } until ($lmStudioProcess -or (Get-Date) -ge $deadline)

          if (-not $lmStudioProcess) {
            throw "LM Studio did not start within 30 seconds."
          }

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Run prompt evaluations
        shell: pwsh
        run: python evals/run_evals.py --output "$env:RUNNER_TEMP\fred-eval-results.json"

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fred-eval-results
          path: ${{ runner.temp }}/fred-eval-results.json
          if-no-files-found: warn