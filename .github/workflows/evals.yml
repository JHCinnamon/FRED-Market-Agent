name: Local Agent Evals

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Run prompts on the local model
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Ensure LM Studio is running
        shell: pwsh
        run: |
          $lmStudioProcess = Get-Process -Name "LM Studio" -ErrorAction SilentlyContinue
          if ($lmStudioProcess) {
            Write-Host "LM Studio is already running."
            exit 0
          }

          $lmStudioExecutable = Join-Path $env:LOCALAPPDATA "Programs\LM Studio\LM Studio.exe"
          if (-not (Test-Path -LiteralPath $lmStudioExecutable -PathType Leaf)) {
            throw "LM Studio is not running and could not be found at: $lmStudioExecutable"
          }

          Start-Process -FilePath $lmStudioExecutable
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            $lmStudioProcess = Get-Process -Name "LM Studio" -ErrorAction SilentlyContinue
          } until ($lmStudioProcess -or (Get-Date) -ge $deadline)

          if (-not $lmStudioProcess) {
            throw "LM Studio did not start within 30 seconds."
          }

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Run prompt evaluations
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "fred-eval-results.json"
          & python evals/run_relevance_evals.py --output $reportPath
          $evaluationExitCode = $LASTEXITCODE

          if (Test-Path -LiteralPath $reportPath -PathType Leaf) {
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            foreach ($result in $report.results | Where-Object { $_.status -eq "failed" }) {
              Write-Host "::error title=Evaluation failed: $($result.id)::$($result.reason)"
              Write-Host "Failed prompt: $($result.id)"
              Write-Host "Reason: $($result.reason)"
            }
          } else {
            Write-Host "::error title=Evaluation report missing::The evaluator did not create $reportPath."
          }

          exit $evaluationExitCode

      - name: Display evaluation report
        if: always()
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "fred-eval-results.json"
          if (Test-Path -LiteralPath $reportPath -PathType Leaf) {
            Get-Content -LiteralPath $reportPath -Raw
          } else {
            Write-Warning "Evaluation report was not created."
          }

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fred-eval-results
          path: ${{ runner.temp }}/fred-eval-results.json
          if-no-files-found: warn